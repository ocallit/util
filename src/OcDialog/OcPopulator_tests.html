<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OcPopulator QUnit Tests</title>
    <link rel="stylesheet" href="../../tools/qunit.css">
    <script src="../../tools/qunit.js"></script>
    <script src="OcPopulator.js"></script>
</head>
<body>
    <div id="qunit"></div>
    <div id="qunit-fixture">
        <!-- Test container that gets reset after each test -->
        <div id="test-container">
            <!-- Text inputs -->
            <!--suppress HtmlFormInputWithoutLabel -->
            <input type="text" id="textInput" />
            <input type="password" id="passwordInput" />
            <input type="email" id="emailInput" />
            <input type="url" id="urlInput" />
            <input type="tel" id="telInput" />
            <input type="search" id="searchInput" />
            <input type="hidden" id="hiddenInput" />
            
            <!-- Number inputs -->
            <input type="number" id="numberInput" />
            <input type="range" id="rangeInput" min="0" max="100" />
            
            <!-- Date/time inputs -->
            <input type="date" id="dateInput" />
            <input type="time" id="timeInput" />
            <input type="datetime-local" id="datetimeInput" />
            <input type="month" id="monthInput" />
            <input type="week" id="weekInput" />
            
            <!-- Checkboxes -->
            <input type="checkbox" id="checkbox1" value="option1" />
            <input type="checkbox" id="checkbox2" checked="checked" value="option2" />
            <input type="checkbox" id="initialyChecked" checked="checked" value="initialy_checked" />

            <!-- Radio button groups -->
            <input type="radio" name="radioGroup1" value="radio1" />
            <input type="radio" name="radioGroup1" value="radio2" />
            <input type="radio" name="radioGroup1" value="radio3" />
            
            <input type="radio" name="radioGroup2" value="groupB1" />
            <input type="radio" name="radioGroup2" value="groupB2" />
            
            <!-- File input -->
            <input type="file" id="fileInput" />
            
            <!-- Color input -->
            <input type="color" id="colorInput" />
            
            <!-- Textarea -->
            <textarea id="textareaField" rows="4" cols="50"></textarea>
            
            <!-- Single select -->
            <select id="singleSelect">
                <option value="">Choose...</option>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
            </select>
            
            <!-- Multiple select -->
            <select id="multipleSelect" multiple>
                <option value="multi1">Multiple 1</option>
                <option value="multi2">Multiple 2</option>
                <option value="multi3">Multiple 3</option>
                <option value="multi4">Multiple 4</option>
            </select>
            
            <!-- Content elements -->
            <span id="spanElement">Initial span content</span>
            <div id="divElement">Initial div content</div>
            <p id="paragraphElement">Initial paragraph content</p>
            <h1 id="headingElement">Initial heading</h1>
            
            <!-- List elements -->
            <ul id="unorderedList">
                <li>Initial item 1</li>
                <li>Initial item 2</li>
            </ul>
            
            <ol id="orderedList">
                <li>Initial ordered item 1</li>
                <li>Initial ordered item 2</li>
            </ol>
            
            <!-- Element for attribute testing -->
            <div id="attributeTest" data-original="value" data-replace="was"></div>
        </div>
    </div>

    <script>

        // QUnit Tests
        QUnit.module('OcPopulator Tests', function(hooks) {
            let container;

            hooks.beforeEach(function() {
                container = document.getElementById('test-container');
            });

            // Input validation tests
            QUnit.test('Container validation', function(assert) {
                assert.throws(() => {
                    OcPopulator.populate(null, {});
                }, /Container must be a valid DOM element/, 'Should throw error for null container');

                assert.throws(() => {
                    OcPopulator.populate("not-a-dom-element", {});
                }, /Container must be a valid DOM element/, 'Should throw error for non-DOM container');

                assert.throws(() => {
                    OcPopulator.populate(container, null);
                }, /Data must be a non-null object/, 'Should throw error for null data');
            });

            // Text input tests
            QUnit.test('Text input population', function(assert) {
                const data = {
                    textInput: 'Hello World',
                    passwordInput: 'secret123',
                    emailInput: 'test@example.com',
                    urlInput: 'https://example.com',
                    telInput: '+1234567890',
                    searchInput: 'search term',
                    hiddenInput: 'hidden value'
                };

                OcPopulator.populate(container, data);

                Object.entries(data).forEach(([id, value]) => {
                    const element = container.querySelector(`#${id}`);
                    assert.equal(element.value, value, `${id} should have correct value`);
                });
            });

            // Number input tests
            QUnit.test('Number input population', function(assert) {
                const data = {
                    numberInput: 42,
                    rangeInput: 75
                };

                OcPopulator.populate(container, data);

                assert.equal(container.querySelector('#numberInput').value, '42', 'Number input should have correct value');
                assert.equal(container.querySelector('#rangeInput').value, '75', 'Range input should have correct value');
            });

            // Date/time input tests
            QUnit.test('Date and time input population', function(assert) {
                const data = {
                    dateInput: '2023-12-25',
                    timeInput: '14:30',
                    datetimeInput: '2023-12-25T14:30',
                    monthInput: '2023-12',
                    weekInput: '2023-W52'
                };

                OcPopulator.populate(container, data);

                Object.entries(data).forEach(([id, value]) => {
                    const element = container.querySelector(`#${id}`);
                    assert.equal(element.value, value, `${id} should have correct value`);
                });
            });

            // Checkbox tests
            QUnit.test('Checkbox population', function(assert) {
                const data = {
                    checkbox1: 'option1',
                    checkbox2: 'different-value'

                };
                OcPopulator.populate(container, data);
                assert.true(container.querySelector('#checkbox1').checked, 'Checkbox1 should be checked when value matches');
                assert.false(container.querySelector('#checkbox2').checked, 'Checkbox2 should not be checked when value doesn\'t match');
                assert.true(container.querySelector('#initialyChecked').checked, 'initialyChecked not in data not touched stays checked');
            });

            // Radio button tests
            QUnit.test('Radio button group population', function(assert) {
                const data = {
                    radioGroup1: 'radio2',
                    radioGroup2: 'groupB1'
                };

                OcPopulator.populate(container, data);

                const group1Radios = container.querySelectorAll('input[name="radioGroup1"]');
                const group2Radios = container.querySelectorAll('input[name="radioGroup2"]');

                assert.false(group1Radios[0].checked, 'First radio in group1 should not be checked');
                assert.true(group1Radios[1].checked, 'Second radio in group1 should be checked');
                assert.false(group1Radios[2].checked, 'Third radio in group1 should not be checked');

                assert.true(group2Radios[0].checked, 'First radio in group2 should be checked');
                assert.false(group2Radios[1].checked, 'Second radio in group2 should not be checked');
            });

            // Textarea tests
            QUnit.test('Textarea population', function(assert) {
                const data = {
                    textareaField: 'This is a\nmultiline\ntext content'
                };

                OcPopulator.populate(container, data);

                assert.equal(container.querySelector('#textareaField').value, data.textareaField, 'Textarea should have correct content');
            });

            // Select tests
            QUnit.test('Single select population', function(assert) {
                const data = {
                    singleSelect: 'option2'
                };

                OcPopulator.populate(container, data);

                const selectElement = container.querySelector('#singleSelect');
                assert.equal(selectElement.value, 'option2', 'Single select should have correct selected value');
            });

            QUnit.test('Multiple select population', function(assert) {
                const data = {
                    multipleSelect: ['multi1', 'multi3']
                };

                OcPopulator.populate(container, data);

                const selectElement = container.querySelector('#multipleSelect');
                const selectedValues = Array.from(selectElement.selectedOptions).map(option => option.value);
                
                assert.deepEqual(selectedValues.sort(), ['multi1', 'multi3'], 'Multiple select should have correct selected values');
            });

            // Content element tests
            QUnit.test('Content element population', function(assert) {
                const data = {
                    spanElement: 'New span content',
                    divElement: 'New div content',
                    paragraphElement: 'New paragraph content',
                    headingElement: 'New heading'
                };

                OcPopulator.populate(container, data);

                Object.entries(data).forEach(([id, value]) => {
                    const element = container.querySelector(`#${id}`);
                    assert.equal(element.textContent, value, `${id} should have correct text content`);
                });
            });

            // List tests
            QUnit.test('List population with arrays', function(assert) {
                const data = {
                    unorderedList: ['Item 1', 'Item 2', 'Item 3'],
                    orderedList: ['First', 'Second', 'Third']
                };

                OcPopulator.populate(container, data);

                const ulItems = container.querySelectorAll('#unorderedList li');
                const olItems = container.querySelectorAll('#orderedList li');

                assert.equal(ulItems.length, 3, 'Unordered list should have 3 items');
                assert.equal(ulItems[0].textContent, 'Item 1', 'First UL item should have correct content');
                assert.equal(ulItems[2].textContent, 'Item 3', 'Third UL item should have correct content');

                assert.equal(olItems.length, 3, 'Ordered list should have 3 items');
                assert.equal(olItems[0].textContent, 'First', 'First OL item should have correct content');
                assert.equal(olItems[2].textContent, 'Third', 'Third OL item should have correct content');
            });

            QUnit.test('Nested list population', function(assert) {
                const data = {
                    unorderedList: ['Item 1', ['Subitem 1', 'Subitem 2'], 'Item 3']
                };

                OcPopulator.populate(container, data);

                const listHtml = container.querySelector('#unorderedList').innerHTML;
                assert.true(listHtml.includes('Subitem 1'), 'Should contain nested subitem 1');
                assert.true(listHtml.includes('Subitem 2'), 'Should contain nested subitem 2');
            });

            // HTML sanitization tests


            QUnit.test('HTML not sanitized when disabled', function(assert) {
                const data = {
                    spanElement: '<strong>Bold content</strong>'
                };

                OcPopulator.populate(container, data, {}, false);

                const element = container.querySelector('#spanElement');
                assert.true(element.innerHTML.includes('<strong>'), 'HTML should be preserved when not sanitized');
                assert.equal(element.textContent, 'Bold content', 'Text content should show formatted content');
            });

            // Attribute tests
            QUnit.test('Attribute setting', function(assert) {
                const data = {
                    attributeTest: 'New content'
                };

                const attributes = {
                    attributeTest: {
                        'data-replace': 'replace',
                        'data-test': 'test-value',
                        'class': 'new-class',
                        'data-original': null // Should remove attribute
                    }
                };

                OcPopulator.populate(container, data, attributes);

                const element = container.querySelector('#attributeTest');
                assert.equal(element.getAttribute('data-replace'), 'replace', 'Should change existing value to replace');
                assert.equal(element.getAttribute('data-test'), 'test-value', 'Should set new attribute data-test to test-value');
                assert.equal(element.getAttribute('class'), 'new-class', 'Should set class attribute');
                assert.false(element.hasAttribute('data-original'), 'Should remove attribute when value is null');
            });

            // Value extraction tests
            QUnit.test('getValuesByKey - basic extraction', function(assert) {
                // Set up some test data
                container.querySelector('#textInput').value = 'test text';
                container.querySelector('#numberInput').value = '123';
                container.querySelector('#textareaField').value = 'textarea content';
                //@TODO add type date, time, datetime-local, month, week, color, etc.....
                const keys = ['textInput', 'numberInput', 'textareaField'];
                const values = OcPopulator.getValuesByKey(container, keys);

                assert.equal(values.textInput, 'test text', 'input type text value should be test text');
                assert.equal(values.numberInput, "123", 'Should extract number input value as string');
                assert.equal(values.textareaField, 'textarea content', 'Should extract textarea value');
            });

            QUnit.test('getValuesByKey - checkbox and radio extraction', function(assert) {
                container.querySelector('#checkbox1').checked = true;
                container.querySelector('input[name="radioGroup1"][value="radio2"]').checked = true;

                const keys = ['checkbox1', 'checkbox2', 'radioGroup1', 'notPresent'];
                const values = OcPopulator.getValuesByKey(container, keys);

                assert.equal(values.checkbox1, 'option1', 'Should extract checked checkbox value: option1 real: =' + values.checkbox1 + "=");
                assert.equal(values.radioGroup1, 'radio2', 'Should extract checked radio value real: =' + values.radioGroup1 + "=");
            });

            QUnit.test('getValuesByKey - select extraction', function(assert) {
                container.querySelector('#singleSelect').value = 'option2';
                
                const multiSelect = container.querySelector('#multipleSelect');
                multiSelect.options[0].selected = true;
                multiSelect.options[2].selected = true;

                const keys = ['singleSelect', 'multipleSelect'];
                const values = OcPopulator.getValuesByKey(container, keys);

                assert.equal(values.singleSelect, 'option2', 'Should extract single select value');
                assert.deepEqual(values.multipleSelect, ['multi1', 'multi3'], 'Should extract multiple select values as array');
            });

            QUnit.test('getValuesByKey - with attributes', function(assert) {
                container.querySelector('#attributeTest').setAttribute('data-custom', 'custom-value');

                const keys = ['attributeTest'];
                const values = OcPopulator.getValuesByKey(container, keys, { includeAttributes: true });

                assert.true('attributeTest_attributes' in values, 'Should include attributes when requested');
                assert.equal(values.attributeTest_attributes['data-custom'], 'custom-value', 'Should extract custom attribute');
            });

            QUnit.test('getValuesByKey - error handling', function(assert) {
                assert.throws(() => {
                    OcPopulator.getValuesByKey(null, []);
                }, /Container must be a valid DOM element/, 'Should throw error for null container');

                assert.throws(() => {
                    OcPopulator.getValuesByKey(container, "not-an-array");
                }, /Keys must be an array/, 'Should throw error for non-array keys');

                // Should not throw for non-existent keys, just skip them
                const values = OcPopulator.getValuesByKey(container, ['nonExistentElement']);
                assert.deepEqual(values, {}, 'Should return empty object for non-existent keys');
            });

            // Edge cases
            QUnit.test('Edge cases - null and undefined values', function(assert) {
                const data = {
                    textInput: null,
                    numberInput: undefined,
                    spanElement: null
                };

                OcPopulator.populate(container, data);

                assert.equal(container.querySelector('#textInput').value, '', 'Null value should become empty string for input');
                assert.equal(container.querySelector('#numberInput').value, '', 'Undefined value should become empty string for input');
                assert.equal(container.querySelector('#spanElement').textContent, '', 'Null value should become empty string for content');
            });

            QUnit.test('Edge cases - empty data object', function(assert) {
                // Should not throw error
                OcPopulator.populate(container, {});
                assert.ok(true, 'Should handle empty data object gracefully');
            });

            QUnit.test('Edge cases - non-existent element IDs', function(assert) {
                const data = {
                    nonExistentElement: 'some value',
                    textInput: 'real value'
                };

                // Should not throw error, just skip non-existent elements
                OcPopulator.populate(container, data);
                assert.equal(container.querySelector('#textInput').value, 'real value', 'Should still populate existing elements');
            });
        });
    </script>
</body>
</html>
