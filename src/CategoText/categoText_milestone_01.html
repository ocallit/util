<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Category Selector</title>
    <style>
        .category-widget {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 600px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        
        .categories-container {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            line-height: 1.5;
            min-height: 30px;
            background-color: white;
        }
        
        .catego_selected {
            background-color: #4CAF50;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            margin: 0 2px;
            display: inline-block;
        }
        
        .catego_unselected {
            background-color: #f1f1f1;
            color: #333;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            margin: 0 2px;
            display: inline-block;
        }
        
        .catego_selected:hover, .catego_unselected:hover {
            opacity: 0.8;
        }
        
        .hidden-inputs {
            display: none;
        }
        
        .widget-controls {
            margin: 10px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .widget-controls button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }
        
        .widget-controls button:hover {
            background-color: #d0d0d0;
        }
        
        .widget-title {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Enhanced Category Selector</h1>
    
    <!-- First Widget -->
    <div class="category-widget" id="widget1">
        <h3 class="widget-title">Seasons</h3>
        <div class="widget-controls">
            <button class="select-all-btn">Select All</button>
            <button class="unselect-all-btn">Unselect All</button>
            <button class="sort-selected-btn">Sort Selected First</button>
        </div>
        <div class="categories-container" data-categories="Spring,Winter,Autumn,Summer,Sports">
            <!-- Categories will be inserted here by JavaScript -->
        </div>
        <div class="hidden-inputs">
            <input type="hidden" name="selected_categories" class="selected-categories-input">
            <input type="hidden" name="selected_ids" class="selected-ids-input">
        </div>
    </div>
    
    <!-- Second Widget -->
    <div class="category-widget" id="widget2">
        <h3 class="widget-title">Colors</h3>
        <div class="widget-controls">
            <button class="select-all-btn">Select All</button>
            <button class="unselect-all-btn">Unselect All</button>
            <button class="sort-selected-btn">Sort Selected First</button>
        </div>
        <div class="categories-container" data-categories="Red,Green,Blue,Yellow,Black,White">
            <!-- Categories will be inserted here by JavaScript -->
        </div>
        <div class="hidden-inputs">
            <input type="hidden" name="selected_categories" class="selected-categories-input">
            <input type="hidden" name="selected_ids" class="selected-ids-input">
        </div>
    </div>

    <script>
        // Initialize all category widgets on the page
        document.addEventListener('DOMContentLoaded', function() {
            const widgets = document.querySelectorAll('.category-widget');
            
            widgets.forEach(function(widget) {
                initializeCategoryWidget(widget);
            });
        });
        
        function initializeCategoryWidget(widgetElement) {
            const container = widgetElement.querySelector('.categories-container');
            const categories = container.dataset.categories.split(',');
            const selectedInput = widgetElement.querySelector('.selected-categories-input');
            const selectedIdsInput = widgetElement.querySelector('.selected-ids-input');
            const selectAllBtn = widgetElement.querySelector('.select-all-btn');
            const unselectAllBtn = widgetElement.querySelector('.unselect-all-btn');
            const sortSelectedBtn = widgetElement.querySelector('.sort-selected-btn');
            
            // Clear the container
            container.innerHTML = '';
            
            // Create category elements
            categories.forEach(function(category, index) {
                const trimmedCategory = category.trim();
                if (!trimmedCategory) return;
                
                const span = document.createElement('span');
                span.textContent = trimmedCategory;
                span.className = 'catego_unselected';
                span.dataset.category = trimmedCategory;
                span.dataset.id = index + 1; // Simple ID generation (in real app, use real IDs)
                
                span.addEventListener('click', function() {
                    toggleCategorySelection(span);
                    updateHiddenInputs();
                });
                
                container.appendChild(span);
                
                // Add comma if not the last element
                if (index < categories.length - 1) {
                    container.appendChild(document.createTextNode(', '));
                }
            });
            
            // Add event listeners for control buttons
            selectAllBtn.addEventListener('click', function() {
                selectAllCategories();
                updateHiddenInputs();
            });
            
            unselectAllBtn.addEventListener('click', function() {
                unselectAllCategories();
                updateHiddenInputs();
            });
            
            sortSelectedBtn.addEventListener('click', function() {
                sortSelectedFirst();
                updateHiddenInputs();
            });
            
            function toggleCategorySelection(element) {
                if (element.classList.contains('catego_unselected')) {
                    element.classList.remove('catego_unselected');
                    element.classList.add('catego_selected');
                } else {
                    element.classList.remove('catego_selected');
                    element.classList.add('catego_unselected');
                }
            }
            
            function selectAllCategories() {
                const allCategories = container.querySelectorAll('[data-category]');
                allCategories.forEach(function(category) {
                    category.classList.remove('catego_unselected');
                    category.classList.add('catego_selected');
                });
            }
            
            function unselectAllCategories() {
                const allCategories = container.querySelectorAll('[data-category]');
                allCategories.forEach(function(category) {
                    category.classList.remove('catego_selected');
                    category.classList.add('catego_unselected');
                });
            }
            
            function sortSelectedFirst() {
                const allElements = Array.from(container.childNodes);
                const selectedCategories = [];
                const unselectedCategories = [];
                const otherNodes = [];
                
                // Categorize all nodes
                allElements.forEach(function(node) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.dataset.category) {
                        if (node.classList.contains('catego_selected')) {
                            selectedCategories.push(node);
                        } else {
                            unselectedCategories.push(node);
                        }
                    } else if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === ',') {
                        // Skip commas - we'll add them back later
                    } else {
                        otherNodes.push(node);
                    }
                });
                
                // Clear container
                container.innerHTML = '';
                
                // Add selected categories with commas
                selectedCategories.forEach((category, index) => {
                    container.appendChild(category);
                    if (index < selectedCategories.length - 1) {
                        container.appendChild(document.createTextNode(', '));
                    }
                });
                
                // Add comma between selected and unselected if both exist
                if (selectedCategories.length > 0 && unselectedCategories.length > 0) {
                    container.appendChild(document.createTextNode(', '));
                }
                
                // Add unselected categories with commas
                unselectedCategories.forEach((category, index) => {
                    container.appendChild(category);
                    if (index < unselectedCategories.length - 1) {
                        container.appendChild(document.createTextNode(', '));
                    }
                });
            }
            
            function updateHiddenInputs() {
                const selectedCategories = [];
                const selectedIds = [];
                
                container.querySelectorAll('.catego_selected').forEach(function(selected) {
                    selectedCategories.push(selected.dataset.category);
                    selectedIds.push(selected.dataset.id);
                });
                
                selectedInput.value = selectedCategories.join(',');
                selectedIdsInput.value = selectedIds.join(',');
                
                // For demo purposes, log the values
                console.log('Widget ID:', widgetElement.id);
                console.log('Selected Categories:', selectedInput.value);
                console.log('Selected IDs:', selectedIdsInput.value);
            }
        }
    </script>
</body>
</html>
