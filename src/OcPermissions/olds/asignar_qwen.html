async function togglePermission(activity, role, permName) {
  // Find the current state locally (before sending to server)
  const row = permissionsData.find(r => r.activity === activity && r.role === role);
  if (!row) return; // Safety check

  const perm = row.permissions.find(p => p.name === permName);
  if (!perm) return; // Safety check

  const currentState = perm.allowed;
  const desiredState = !currentState; // Toggle the state

  try {
    // Send the NEW desired state to the server
    const response = await fetch('/api/permissions/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        activity,
        role,
        permission: permName,
        allowed: desiredState  // Send the new state we want
      })
    });

    if (response.ok) {
      // Get the ACTUAL final state from the server response
      const result = await response.json();

      // Update the local state to match what the server actually set
      perm.allowed = result.allowed;  // Use server's final state

      // Re-render the table to reflect the server's response
      applyFilters();
    } else {
      // Server rejected the change - show error, revert UI if needed
      console.error('Failed to toggle permission:', response.status);
      alert(`Could not update permission. Server said: ${response.status}`);
      // Optionally, re-render to show original state (in case of optimistic update)
    }
  } catch (error) {
    console.error('Network error toggling permission:', error);
    alert('Network error. Permission state may be out of sync.');
    // Optionally revert the UI here too
  }
}

        allowed: !oldState  // Send the desired new state
      })

    if (response.ok) {
      const result = await response.json();
      // Server confirmed the change - keep the optimistic state

      // Server rejected - revert to old state
      perm.allowed = oldState;
      applyFilters();
      alert('Could not update permission: ' + response.status);
    }
  } catch (error) {
    // Network error - revert to old state
    perm.allowed = oldState;
    applyFilters();
    alert('Network error. Changes reverted.');
  }

<body>

  <h1>Permissions Manager</h1>

  <div class="controls">
    <input type="text" id="filterInput" placeholder="Filter by activity, role, or permission...">
    <button onclick="toggleEditMode()">Toggle Edit Mode</button>
  </div>

  <div class="export-section">
    <button class="export-btn" onclick="exportToCSV()">Export to CSV</button>
    <button class="export-btn pdf" onclick="printTable()">Print/PDF Export</button>
  </div>

  <table id="permissionsTable">
    <thead>
      <tr>
        <th class="sortable" onclick="sortTable(0)">Activity</th>
        <th class="sortable" onclick="sortTable(1)">Role</th>
        <th>Permissions</th>
        <!-- Hidden print columns -->
        <th class="print-allowed-cell" style="display:none;">Allowed Permissions</th>
        <th class="print-denied-cell" style="display:none;">Denied Permissions</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Filled by JS -->
    </tbody>
  </table>

  <script>
    let permissionsData = [];
    let currentSort = { index: -1, direction: 'asc' };
    let isEditMode = false;

    // Mock data fetch
    async function fetchPermissions() {
      // Simulate API delay
      await new Promise(resolve => setTimeout(resolve, 500));
      
      return [
        {
          activity: 'car',
          role: 'Care taker',
          permissions: [
            { name: 'Register', allowed: true },
            { name: 'Add', allowed: true },
            { name: 'Delete', allowed: false }
          ]
        },
        {
          activity: 'car',
          role: 'Chauffer',
          permissions: [
            { name: 'Gasoline', allowed: true },
            { name: 'Trip', allowed: true },
            { name: 'Delete', allowed: false },
            { name: 'Repair', allowed: false },
            { name: 'Maintenance', allowed: false },
            { name: 'Schedule', allowed: false }
          ]
        },
        {
          activity: 'cats',
          role: 'Care taker',
          permissions: [
            { name: 'Register', allowed: true },
            { name: 'Add', allowed: true },
            { name: 'Delete', allowed: false }
          ]
        },
        {
          activity: 'truck',
          role: 'Driver',
          permissions: [
            { name: 'Fuel', allowed: true },
            { name: 'Route', allowed: true },
            { name: 'Maintenance', allowed: true },
            { name: 'Delete', allowed: false },
            { name: 'Schedule', allowed: false }
          ]
        }
      ];
    }

    function renderTable(data = permissionsData) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');

        // Activity cell
        const activityCell = document.createElement('td');
        activityCell.textContent = row.activity;

        // Role cell
        const roleCell = document.createElement('td');
        roleCell.textContent = row.role;

        // Permissions cell (single column for screen)
        const permCell = document.createElement('td');
        permCell.className = 'perm-cell';
        row.permissions.forEach(perm => {
          const chip = document.createElement('span');
          chip.className = `perm-chip ${perm.allowed ? 'perm-allowed' : 'perm-denied'}`;
          chip.textContent = `${perm.allowed ? '✅ ' : '❌ '}${perm.name}`;
          
          if (isEditMode) {
            chip.classList.add('editable');
            chip.onclick = () => togglePermission(row.activity, row.role, perm.name);
          }
          
          permCell.appendChild(chip);
        });

        // Hidden print cells (two columns)
        const allowedCell = document.createElement('td');
        allowedCell.className = 'print-allowed-cell';
        allowedCell.style.display = 'none';
        allowedCell.innerHTML = row.permissions
          .filter(p => p.allowed)
          .map(p => `<span class="print-perm-allowed">✅ ${p.name}</span>`)
          .join(', ');

        const deniedCell = document.createElement('td');
        deniedCell.className = 'print-denied-cell';
        deniedCell.style.display = 'none';
        deniedCell.innerHTML = row.permissions
          .filter(p => !p.allowed)
          .map(p => `<span class="print-perm-denied">❌ ${p.name}</span>`)
          .join(', ');

        tr.appendChild(activityCell);
        tr.appendChild(roleCell);
        tr.appendChild(permCell);
        tr.appendChild(allowedCell);
        tr.appendChild(deniedCell);

        tbody.appendChild(tr);
      });
    }

    function togglePermission(activity, role, permName) {
      const row = permissionsData.find(r => r.activity === activity && r.role === role);
      if (row) {
        const perm = row.permissions.find(p => p.name === permName);
        if (perm) {
          perm.allowed = !perm.allowed;
          // Re-render to reflect changes
          applyFilters();
        }
      }
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.querySelector('button[onclick="toggleEditMode()"]').textContent = 
        isEditMode ? 'Exit Edit Mode' : 'Enter Edit Mode';
      applyFilters(); // Re-render with updated editability
    }

    function sortTable(columnIndex) {
      if (currentSort.index === columnIndex) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.index = columnIndex;
        currentSort.direction = 'asc';
      }

      permissionsData.sort((a, b) => {
        let valA, valB;
        if (columnIndex === 0) {
          valA = a.activity;
          valB = b.activity;
        } else if (columnIndex === 1) {
          valA = a.role;
          valB = b.role;
        } else {
          // Sort by first permission name for permissions column
          valA = a.permissions.length > 0 ? a.permissions[0].name : '';
          valB = b.permissions.length > 0 ? b.permissions[0].name : '';
        }

        if (typeof valA === 'string') {
          return currentSort.direction === 'asc' 
            ? valA.localeCompare(valB) 
            : valB.localeCompare(valA);
        } else {
          return currentSort.direction === 'asc' ? valA - valB : valB - valA;
        }
      });

      applyFilters();
    }

    function applyFilters() {
      const filterText = document.getElementById('filterInput').value.toLowerCase();
      
      const filteredData = permissionsData.filter(row => {
        // Check activity, role, or any permission name
        return (
          row.activity.toLowerCase().includes(filterText) ||
          row.role.toLowerCase().includes(filterText) ||
          row.permissions.some(perm => perm.name.toLowerCase().includes(filterText))
        );
      });

      renderTable(filteredData);
    }

    function exportToCSV() {
      let csv = 'Activity,Role,"Allowed Permissions","Denied Permissions"\n';
      
      permissionsData.forEach(row => {
        const allowed = row.permissions
          .filter(p => p.allowed)
          .map(p => p.name)
          .join('; ');
        const denied = row.permissions
          .filter(p => !p.allowed)
          .map(p => p.name)
          .join('; ');
        
        // Escape quotes and wrap in quotes
        const activity = `"${row.activity.replace(/"/g, '""')}"`;
        const role = `"${row.role.replace(/"/g, '""')}"`;
        const allowedEscaped = `"${allowed.replace(/"/g, '""')}"`;
        const deniedEscaped = `"${denied.replace(/"/g, '""')}"`;
        
        csv += `${activity},${role},${allowedEscaped},${deniedEscaped}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', 'permissions.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function printTable() {
      window.print();
    }

    // Initialize
    (async () => {
      permissionsData = await fetchPermissions();
      renderTable();
      
      // Add filter event listener
      document.getElementById('filterInput').addEventListener('input', applyFilters);
    })();

  </script>

</body>
</html>
