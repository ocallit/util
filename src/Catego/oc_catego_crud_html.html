    <script id="oc_catego_crud_mock_fetch">

        // Override fetch for testing without server (with debug logging)
        const originalFetch = window.fetch;
        window.fetch = function(url, options) {
            console.log("********** FETCH CALLED **********", url, options)
            if (url.includes('catego/ajax.php')) {
                console.log('FETCHED', arguments); // Debug log
                return mockCategoriesAPI(url, options);
            }
            return originalFetch.call(this, url, options);
        };

        // Mock API for testing
        function mockCategoriesAPI(url, options) {
            const body = options.body;
            const formData = new URLSearchParams(body);
            const action = formData.get('action');
            const categoryType = formData.get('category_type');

            return new Promise((resolve) => {
                setTimeout(() => {
                    let response;
                    
                    switch (action) {
                        case 'list':
                            response = {
                                success: true,
                                error: null,
                                data: getMockCategories(categoryType)
                            };
                            break;
                            
                        case 'upsert':
                            const category = formData.get('category');
                            const id = formData.get('oc_category_id');
                            response = {
                                success: true,
                                error: null,
                                data: {
                                    oc_category_id: id || Math.floor(Math.random() * 1000) + 1,
                                    category_type: categoryType,
                                    category: category,
                                    category_data: {}
                                }
                            };
                            break;
                            
                        case 'delete':
                            response = {
                                success: true,
                                error: null,
                                data: { deleted: true }
                            };
                            break;
                            
                        default:
                            response = { success: false, error: 'Unknown action' };
                    }
                    
                    resolve({
                        ok: response.success,
                        json: () => Promise.resolve(response)
                    });
                }, 500);
            });
        }

        function getMockCategories(categoryType) {
            const categories = {
                'Cliente': [
                    { oc_category_id: 1, category: 'VIP', category_data: { priority: 'high', discount: 15 }, alta_db: '2024-01-15 10:30:00' },
                    { oc_category_id: 2, category: 'Regular', category_data: { priority: 'normal', discount: 5 }, alta_db: '2024-01-15 10:31:00' },
                    { oc_category_id: 3, category: 'Corporativo', category_data: { priority: 'high', discount: 20 }, alta_db: '2024-01-15 10:32:00' }
                ],
                'Producto': [
                    { oc_category_id: 4, category: 'Electrónicos', category_data: { tax_rate: 18.5, warranty: '2 años' }, alta_db: '2024-01-15 11:00:00' },
                    { oc_category_id: 5, category: 'Ropa', category_data: { tax_rate: 16, warranty: '30 días' }, alta_db: '2024-01-15 11:01:00' },
                    { oc_category_id: 6, category: 'Libros', category_data: { tax_rate: 0, warranty: 'N/A' }, alta_db: '2024-01-15 11:02:00' }
                ],
                'Servicio': [
                    { oc_category_id: 7, category: 'Consultoría', category_data: { hourly_rate: 150, tax_rate: 16 }, alta_db: '2024-01-15 12:00:00' },
                    { oc_category_id: 8, category: 'Soporte Técnico', category_data: { hourly_rate: 75, tax_rate: 16 }, alta_db: '2024-01-15 12:01:00' }
                ]
            };
            return categories[categoryType] || [];
        }
</script>

    <script id="demo_script">

        // Example external dialog form functions (Method 2)
        async function externalProductForm(data) {
            return new Promise((resolve) => {
                // Create external dialog
                const dialog = document.createElement('dialog');
                dialog.className = 'sch_dialog sch_dialog--medium';
                dialog.innerHTML = `
                    <div class="sch_dialog_header">
                        <h2 class="sch_dialog_title">${data.oc_category_id ? 'Editar' : 'Nueva'} Categoría de Producto</h2>
                        <button class="sch_dialog_close" onclick="this.closest('dialog').close(); this.closest('dialog').remove();">&times;</button>
                    </div>
                    <div class="sch_dialog_content">
                        <form method="dialog">
                            <div class="sch_form_group">
                                <label class="sch_form_label">Nombre de la Categoría *</label>
                                <input type="text" name="category" class="sch_form_input" value="${data.category || ''}" required>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Stock Mínimo *</label>
                                <input type="number" name="stock_minimo" class="sch_form_input" value="${data.stock_minimo || 10}" min="0" required>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Stock Máximo *</label>
                                <input type="number" name="stock_maximo" class="sch_form_input" value="${data.stock_maximo || 1000}" min="1" required>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Ubicación en Almacén</label>
                                <input type="text" name="ubicacion" class="sch_form_input" value="${data.ubicacion || ''}" placeholder="Ej: A-15, B-23">
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Categoría Padre</label>
                                <select name="categoria_padre" class="sch_form_input">
                                    <option value="">Sin categoría padre</option>
                                    <option value="electronicos" ${data.categoria_padre === 'electronicos' ? 'selected' : ''}>Electrónicos</option>
                                    <option value="ropa" ${data.categoria_padre === 'ropa' ? 'selected' : ''}>Ropa</option>
                                    <option value="hogar" ${data.categoria_padre === 'hogar' ? 'selected' : ''}>Hogar</option>
                                </select>
                            </div>

                            <input type="hidden" name="category_type" value="${data.category_type}">
                            <input type="hidden" name="oc_category_id" value="${data.oc_category_id || ''}">
                        </form>
                    </div>
                    <div class="sch_dialog_footer">
                        <button class="sch_dialog_button sch_dialog_button--outline" onclick="resolveDialog('cancel')">
                            Cancelar
                        </button>
                        <button class="sch_dialog_button sch_dialog_button--success" onclick="resolveDialog('save')">
                            Guardar
                        </button>
                    </div>
                `;
                
                document.body.appendChild(dialog);
                
                function resolveDialog(action) {
                    if (action === 'save') {
                        const form = dialog.querySelector('form');
                        const formData = new FormData(form);
                        
                        // Validation
                        const stockMin = parseInt(formData.get('stock_minimo'));
                        const stockMax = parseInt(formData.get('stock_maximo'));
                        const category = formData.get('category').trim();
                        
                        if (!category) {
                            alert('El nombre de la categoría es requerido');
                            return;
                        }
                        
                        if (stockMax <= stockMin) {
                            alert('El stock máximo debe ser mayor al mínimo');
                            return;
                        }
                        
                        // Convert FormData to object
                        const result = {};
                        for (let [key, value] of formData.entries()) {
                            if (value) result[key] = value;
                        }
                        
                        dialog.close();
                        dialog.remove();
                        resolve(result);
                    } else {
                        dialog.close();
                        dialog.remove();
                        resolve('cancel');
                    }
                }
                
                // Make resolveDialog available to onclick handlers
                window.resolveDialog = resolveDialog;
                
                dialog.showModal();
                
                // Focus first input
                dialog.querySelector('input[name="category"]').focus();
                
                // Handle form submission
                dialog.querySelector('form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    resolveDialog('save');
                });
                
                // Clean up on close
                dialog.addEventListener('close', () => {
                    setTimeout(() => {
                        if (dialog.parentNode) {
                            dialog.remove();
                        }
                        delete window.resolveDialog;
                    }, 100);
                });
            });
        }

        // Example service form
        async function externalServiceForm(data) {
            return new Promise((resolve) => {
                const dialog = document.createElement('dialog');
                dialog.className = 'sch_dialog sch_dialog--medium';
                dialog.innerHTML = `
                    <div class="sch_dialog_header">
                        <h2 class="sch_dialog_title">${data.oc_category_id ? 'Editar' : 'Nueva'} Categoría de Servicio!!</h2>
                        <button class="sch_dialog_close" onclick="resolveServiceDialog('cancel')">&times;</button>
                    </div>
                    <div class="sch_dialog_content">
                        <form method="dialog">
                            <div class="sch_form_group">
                                <label class="sch_form_label">Nombre del Servicio *</label>
                                <input type="text" name="category" class="sch_form_input" value="${data.category || ''}" required>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Tarifa por Hora *</label>
                                <input type="number" name="tarifa_hora" class="sch_form_input" value="${data.tarifa_hora || 150}" step="0.01" min="0" required>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Descripción</label>
                                <textarea name="descripcion" class="sch_form_input sch_form_textarea" placeholder="Descripción del servicio...">${data.descripcion || ''}</textarea>
                            </div>
                            
                            <div class="sch_form_group">
                                <label class="sch_form_label">Prioridad</label>
                                <select name="prioridad" class="sch_form_input">
                                    <option value="baja" ${data.prioridad === 'baja' ? 'selected' : ''}>Baja</option>
                                    <option value="media" ${data.prioridad === 'media' ? 'selected' : ''}>Media</option>
                                    <option value="alta" ${data.prioridad === 'alta' ? 'selected' : ''}>Alta</option>
                                </select>
                            </div>

                            <input type="hidden" name="category_type" value="${data.category_type}">
                            <input type="hidden" name="oc_category_id" value="${data.oc_category_id || ''}">
                        </form>
                    </div>
                    <div class="sch_dialog_footer">
                        <button class="sch_dialog_button sch_dialog_button--outline" onclick="resolveServiceDialog('cancel')">
                            Cancelar
                        </button>
                        <button class="sch_dialog_button sch_dialog_button--success" onclick="resolveServiceDialog('save')">
                            Guardar
                        </button>
                    </div>
                `;
                
                document.body.appendChild(dialog);
                
                function resolveServiceDialog(action) {
                    if (action === 'save') {
                        const form = dialog.querySelector('form');
                        const formData = new FormData(form);
                        
                        const category = formData.get('category').trim();
                        const tarifa = parseFloat(formData.get('tarifa_hora'));
                        
                        if (!category) {
                            alert('El nombre del servicio es requerido');
                            return;
                        }
                        
                        if (tarifa <= 0) {
                            alert('La tarifa debe ser mayor a 0');
                            return;
                        }
                        
                        const result = {};
                        for (let [key, value] of formData.entries()) {
                            if (value) result[key] = value;
                        }
                        
                        dialog.close();
                        dialog.remove();
                        resolve(result);
                    } else {
                        dialog.close();
                        dialog.remove();
                        resolve('cancel');
                    }
                }
                
                window.resolveServiceDialog = resolveServiceDialog;
                dialog.showModal();
                dialog.querySelector('input[name="category"]').focus();
                
                dialog.querySelector('form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    resolveServiceDialog('save');
                });
                
                dialog.addEventListener('close', () => {
                    setTimeout(() => {
                        if (dialog.parentNode) {
                            dialog.remove();
                        }
                        delete window.resolveServiceDialog;
                    }, 100);
                });
            });
        }

    </script>
