<!DOCTYPE html>
<html lang="es-MX">
<head>
    <!-- ocCatego Demo Page -->
    <!-- File: demo.html -->
    <!-- Path: /catego/catego.html -->
    <!-- Version: 1.0.0 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>ocCatego Widget - Demo</title>
    <style>


        /* Demo page styling */
        .oc_catego_demo-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--color-surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--elevation-2);
        }

        .oc_catego_demo-title {
            color: var(--color-primary);
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 500;
        }

        .demo-buttons {
            margin: 1em 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .demo-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .demo-button--info {
            background: var(--color-info);
            color: white;
        }

        .demo-button--accent {
            background: var(--color-accent);
            color: white;
        }

        .demo-button--tertiary {
            background: var(--color-tertiary);
            color: white;
        }

        .demo-button:hover {
            transform: translateY(-1px);
            box-shadow: var(--elevation-glass-1);
        }

        .demo-output {
            padding: 10px;
            background: var(--color-neutral-bg);
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            min-height: 20px;
            border-left: 4px solid var(--color-info);
        }

        .usage-example {
            background: var(--color-neutral-bg);
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            margin: 15px 0;
            border-left: 4px solid var(--color-primary);
        }
    </style>
    
    <!-- Include widget CSS -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="catego.css">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

        <!-- Hidden select for form integration -->
        <select id="cliente_categorias_select" name="cliente_categorias[]" multiple style="display:none">
            <option value="1" selected>Sin Credito</option>
            <option value="5" selected>Transportista</option>
            <option value="2">Mayoreo</option>
            <option value="3">Con Credito</option>
            <option value="4">Foraneo</option>
        </select>

        <!-- Widget HTML -->
        <div class="oc_catego" data-oc_catego="clientes" data-oc_catego_linked_select="cliente_categorias_select"
             aria-label="Categorías de Clientes" role="group">
            <div class="oc_catego_title">Categorías de Clientes</div>

            <div class="oc_catego_header">
                <div class="oc_catego_search-container">
                    <input 
                        type="search"
                        class="oc_catego_search-input"
                        placeholder="Buscar categorías..."
                        aria-label="Buscar categorías"
                        value=""
                    >
                    <button 
                        type="button" 
                        tabindex="-1" 
                        class="oc_catego_clear-btn"
                        onclick="ocWidgetCatego.clearSearch(this)"
                        title="Limpiar búsqueda"
                    >&times;</button>
                </div>
                <!-- enhancement for phase 2
                <button 
                    type="button" 
                    class="oc_catego_crud-button"
                    title="Administrar, altas, bajas y cambios de categorías"
                    onclick="ocWidgetCatego.openCRUD('clientes')"
                >&#9881; Definir</button>
                -->
            </div>

            <div class="oc_catego_content">
                <div class="oc_catego_column oc_catego_column--selected">
                    <div class="oc_catego_column-header">✓ Asignadas</div>
                    <div class="oc_catego_list oc_catego_si" role="listbox" aria-label="Categorías asignadas"></div>
                    <div class="oc_catego_column-footer">
                        <button 
                            class="oc_catego_move-all-button oc_catego_move-all-button--from-assigned"
                            type="button"
                            onclick="ocWidgetCatego.moveAllCategories(this, 'right')"
                            title="Remover todas las categorías"
                        >Quitar Todas ››</button>
                        <div class="oc_catego_column-count">n categorías</div>
                    </div>
                </div>

                <div class="oc_catego_column oc_catego_column--available">
                    <div class="oc_catego_column-header">○ Disponibles</div>
                    <div class="oc_catego_list oc_catego_disponibles" role="listbox" aria-label="Categorías disponibles"></div>
                    <div class="oc_catego_column-footer">
                        <button 
                            class="oc_catego_move-all-button oc_catego_move-all-button--from-available"
                            type="button"
                            onclick="ocWidgetCatego.moveAllCategories(this, 'left')"
                            title="Asignar todas las categorías"
                        >‹‹ Asignar Todas</button>
                        <div class="oc_catego_column-count">n categorías</div>
                    </div>
                </div>
            </div>
        </div>



    <!-- Include widget JavaScript -->
    <script src="catego.js"></script>
    
    <!-- Demo functions -->
    <script id="demo-functions">
        // Demo functions for testing
        function showSelectedValues() {
            const widget = document.querySelector('.oc_catego');
            const selectedIds = ocWidgetCatego.getValue(widget);
            const output = document.getElementById('demo-output');
            
            output.innerHTML = `
                <strong>Valores Seleccionados:</strong><br>
                IDs: [${selectedIds.join(', ')}]<br>
                Select HTML value: ${JSON.stringify(Array.from(document.getElementById('cliente_categorias_select').selectedOptions).map(o => o.value))}
            `;
        }

        function setExternalValues() {
            const widget = document.querySelector('.oc_catego');
            ocWidgetCatego.setValue(widget, ['2', '3']); // Cliente Regular y Cliente VIP
            showSelectedValues();
        }

        function clearAllSelections() {
            const widget = document.querySelector('.oc_catego');
            ocWidgetCatego.clear(widget);
            showSelectedValues();
        }
    </script>
</body>
</html>
