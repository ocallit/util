<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Categorias JqueryUI</title>

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/redmond/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>


    <link rel="stylesheet" href="OcCategoUI.css">
    <script src="OcCategoUI.js"></script>
</head>
<body>


<select id="mySelect" placeholder="Pick one..." multiple>
    <option value="a" selected>Alpha</option>
    <option value="b">Betá</option>
    <option value="bo">bolaños</option>
    <option value="g">Gamma</option>
</select>
<button type="button" id="editCatsBtn">Edit options…</button>

<script>
    // Initialize Tom Select first
    var ts = new TomSelect('#mySelect', { create: false });

    // Attach the editor widget to this select + button
    window.OcCategoUI_create({
        select: '#mySelect',
        editButton: '#editCatsBtn'
    });
</script>

</body>
</html>
