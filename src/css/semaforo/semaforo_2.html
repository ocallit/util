<!DOCTYPE html>
<html>
<head>
    <style>
        .semaphore-container {
            width: 120px;
            height: 320px;
            background: #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
            box-shadow: 
                0 0 15px rgba(0,0,0,0.6),
                inset 0 5px 15px rgba(255,255,255,0.1);
            border: 4px solid #444;
            position: relative;
        }
        
        .semaphore-container::after {
            content: '';
            position: absolute;
            bottom: -50px;
            width: 30px;
            height: 50px;
            background: #222;
            z-index: -1;
        }
        
        .light {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 5px;
            position: relative;
            box-shadow: 
                inset 0 5px 15px rgba(0,0,0,0.4),
                0 0 10px rgba(0,0,0,0.6);
        }
        
        .light::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: inherit;
            filter: brightness(1.1);
        }
        
        /* Red Light */
        .red.on {
            background: radial-gradient(circle at 35% 35%, #FF8A80 0%, #D50000 60%, #B71C1C 100%);
            box-shadow: 
                inset 0 -5px 15px rgba(255,255,255,0.2),
                0 0 20px rgba(213, 0, 0, 0.6);
        }
        
        .red.off {
            background: radial-gradient(circle at 65% 65%, #3a1a1a 0%, #2a0e0e 60%, lightcoral 100%);
            box-shadow: 
                inset 0 5px 15px rgba(0,0,0,0.6),
                0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Amber Light */
        .amber.on {
            background: radial-gradient(circle at 35% 35%, #FFE082 0%, #FFB300 60%, #FF8F00 100%);
            box-shadow: 
                inset 0 -5px 15px rgba(255,255,255,0.2),
                0 0 20px rgba(255, 179, 0, 0.6);
        }
        
        .amber.off {
            background: radial-gradient(circle at 65% 65%, #3a2e1a 0%, #2a200e 60%, #1a1406 100%);
            box-shadow: 
                inset 0 5px 15px rgba(0,0,0,0.6),
                0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Green Light */
        .green.on {
            background: radial-gradient(circle at 35% 35%, #CCFF90 0%, #64DD17 60%, #2E7D32 100%);
            box-shadow: 
                inset 0 -5px 15px rgba(255,255,255,0.2),
                0 0 20px rgba(100, 221, 23, 0.6);
        }
        
        .green.off {
            background: radial-gradient(circle at 65% 65%, #1a2a1a 0%, #0e1a0e 60%, #061006 100%);
            box-shadow: 
                inset 0 5px 15px rgba(0,0,0,0.6),
                0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="semaphore-container">
        <div class="light red on" id="red-light"></div>
        <div class="light amber off" id="amber-light"></div>
        <div class="light green off" id="green-light"></div>
    </div>
    
    <script>
        // Simple cycling through the lights
        const lights = ['red', 'amber', 'green'];
        let current = 0;
        
        function changeLight() {
            document.getElementById('red-light').className = 'light red off';
            document.getElementById('amber-light').className = 'light amber off';
            document.getElementById('green-light').className = 'light green off';
            
            document.getElementById(`${lights[current]}-light`).className = `light ${lights[current]} on`;
            
            current = (current + 1) % lights.length;
        }
        
        setInterval(changeLight, 2000);
    </script>
</body>
</html>
