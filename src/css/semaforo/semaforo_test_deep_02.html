<!DOCTYPE html>
<html>
<head>
    <style>
        .semaphore-container {
            --base-size: 8px; /* Change this to scale everything */
            width: var(--base-size);
            height: calc(var(--base-size) * 2.6667); /* 80/30 ratio */
            background: #666;
            border-radius: calc(var(--base-size) * 0.125); /* 15/120 ratio */
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: calc(var(--base-size) * 0.1667) 0; /* 5/30 ratio */
            box-shadow: 
                0 0 calc(var(--base-size) * 0.125) rgba(0,0,0,0.6),
                inset 0 calc(var(--base-size) * 0.0417) calc(var(--base-size) * 0.125) rgba(255,255,255,0.1);
            border: calc(var(--base-size) * 0.0333) solid #CCC; /* 4/120 ratio */
            position: relative;
        }
        
        .semaphore-container::after {
            content: '';
            position: absolute;
            bottom: calc(var(--base-size) * -1.6667); /* -50/30 ratio */
            width: calc(var(--base-size) * 0.25); /* 30/120 ratio */
            height: calc(var(--base-size) * 1.6667); /* 50/30 ratio */
            background: #222;
            z-index: -1;
        }
        
        .light {
            width: calc(var(--base-size) * 0.6667); /* 80/120 ratio */
            height: calc(var(--base-size) * 0.6667);
            border-radius: 50%;
            margin: calc(var(--base-size) * 0.0417); /* 5/120 ratio */
            position: relative;
            box-shadow: 
                inset 0 calc(var(--base-size) * 0.0417) calc(var(--base-size) * 0.125) rgba(0,0,0,0.4),
                0 0 calc(var(--base-size) * 0.0833) rgba(0,0,0,0.6);
        }
        
        .light::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: inherit;
            filter: brightness(1.1);
        }
        
        /* Red Light */
        .red.on {
            background: radial-gradient(circle at 35% 35%, #FF8A80 0%, #D50000 60%, #B71C1C 100%);
            box-shadow: 
                inset 0 calc(var(--base-size) * -0.0417) calc(var(--base-size) * 0.125) rgba(255,255,255,0.2),
                0 0 calc(var(--base-size) * 0.1667) rgba(213, 0, 0, 0.6);
        }
        

        
        /* Amber Light */
        .amber.on {
            background: radial-gradient(circle at 35% 35%, #FFE082 0%, #FFB300 60%, #FF8F00 100%);
            box-shadow: 
                inset 0 calc(var(--base-size) * -0.0417) calc(var(--base-size) * 0.125) rgba(255,255,255,0.2),
                0 0 calc(var(--base-size) * 0.1667) rgba(255, 179, 0, 0.6);
        }
        

        
        /* Green Light */
        .green.on {
            background: radial-gradient(circle at 35% 35%, #CCFF90 0%, #64DD17 60%, #2E7D32 100%);
            box-shadow: 
                inset 0 calc(var(--base-size) * -0.0417) calc(var(--base-size) * 0.125) rgba(255,255,255,0.2),
                0 0 calc(var(--base-size) * 0.1667) rgba(100, 221, 23, 0.6);
        }
        



        /* Red Light Off with subtle tint */
        .red.off {
            background: radial-gradient(circle at 65% 65%, #3a1a1a 0%, #2a0e0e 60%, #1a0606 100%);
            box-shadow:
                    inset 0 calc(var(--base-size) * 0.0417) calc(var(--base-size) * 0.125) rgba(0,0,0,0.6),
                    0 calc(var(--base-size) * 0.0167) calc(var(--base-size) * 0.0417) rgba(0,0,0,0.3);
            filter: brightness(0.7) sepia(0.3) saturate(3) hue-rotate(-5deg);
        }

        /* Amber Light Off with subtle tint */
        .amber.off {
            background: radial-gradient(circle at 65% 65%, #3a2e1a 0%, #2a200e 60%, #1a1406 100%);
            box-shadow:
                    inset 0 calc(var(--base-size) * 0.0417) calc(var(--base-size) * 0.125) rgba(0,0,0,0.6),
                    0 calc(var(--base-size) * 0.0167) calc(var(--base-size) * 0.0417) rgba(0,0,0,0.3);
            filter: brightness(0.7) sepia(0.4) saturate(3) hue-rotate(5deg);
        }

        /* Green Light Off with subtle tint */
        .green.off {
            background: radial-gradient(circle at 65% 65%, #1a2a1a 0%, #0e1a0e 60%, #061006 100%);
            box-shadow:
                    inset 0 calc(var(--base-size) * 0.0417) calc(var(--base-size) * 0.125) rgba(0,0,0,0.6),
                    0 calc(var(--base-size) * 0.0167) calc(var(--base-size) * 0.0417) rgba(0,0,0,0.3);
            filter: brightness(0.7) sepia(0.3) saturate(3) hue-rotate(40deg);
        }
    </style>
</head>
<body>
    <div class="semaphore-container">
        <div class="light red on" id="red-light"></div>
        <div class="light amber off" id="amber-light"></div>
        <div class="light green off" id="green-light"></div>
    </div>
    
    <script>
        // Simple cycling through the lights
        const lights = ['red', 'amber', 'green'];
        let current = 0;
        
        function changeLight() {
            document.getElementById('red-light').className = 'light red off';
            document.getElementById('amber-light').className = 'light amber off';
            document.getElementById('green-light').className = 'light green off';
            
            document.getElementById(`${lights[current]}-light`).className = `light ${lights[current]} on`;
            
            current = (current + 1) % lights.length;
        }
        
        setInterval(changeLight, 2000);
    </script>
</body>
</html>
