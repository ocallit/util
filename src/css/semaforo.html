<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Title</title>

</head>
<body style="margin:2em">

<style>
    .semaforo {width:24px;height:24px;background-color: #2D2D2D;padding: 0.1em;border: black 1px solid;border-radius: 8px}
    .semaforoOn {}
    .semaforoOff {opacity: 0.6}
</style>
    <div class="semaforo">
        <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="redGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
                    <stop offset="0%" style="stop-color:#FF8A80; stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#D50000; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B71C1C; stop-opacity:1" />
                </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="50" fill="url(#redGradient)" />
        </svg>
    </div>

    <div class="semaforo">
        <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="semaforoOff">
            <defs>
                <radialGradient id="yellowGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
                    <stop offset="0%" style="stop-color:#FFFF8D;" />
                    <stop offset="60%" style="stop-color:#FFD600;" />
                    <stop offset="100%" style="stop-color:#FFAB00;" />
                </radialGradient>
            </defs>

            <circle cx="50" cy="50" r="50" fill="url(#yellowGradient)" />
        </svg>
    </div>

    <div class="semaforo">
    <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="greenGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%" >
                <stop offset="0%" style="stop-color:#B9F6CA;" />
                <stop offset="60%" style="stop-color:#00C853;" />
                <stop offset="100%" style="stop-color:#1B5E20;" />
            </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#greenGradient)" />
    </svg>
    </div>
<div class="semaforo">
    <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="darkHoleGradient" cx="50%" cy="50%" r="50%" fx="65%" fy="65%">
                <stop offset="0%" style="stop-color:#1B5E20;" />
                <stop offset="60%" style="stop-color:#00C853;" />
                <stop offset="100%" style="stop-color:#B9F6CA;" />
            </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#darkHoleGradient)" />
    </svg>
</div>
<div class="semaforo" style="background-color: whitesmoke">
<svg width="100%" height="100%" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="purpleBulbGradient" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
            <stop offset="0%" style="stop-color:#7B1FA2;" />
            <stop offset="70%" style="stop-color:#4A148C;" />
            <stop offset="100%" style="stop-color:#1A001A;" />
        </radialGradient>
    </defs>

    <ellipse cx="50" cy="60" rx="50" ry="60" fill="url(#purpleBulbGradient)" />

</svg>
</div>
</body>
</html>
