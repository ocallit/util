<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <title>OcEcharts Simple Monthly Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style id="styles_switch">
        .switch-container {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            font-family: sans-serif;
            font-size: 12px;
            position: relative;
            cursor:pointer;
        }

        INPUT.switch-toggle {
            opacity: 0;
            width: 40px;
            height: 20px;
            position: absolute;
        }

        .switch-toggle-wrapper {
            position: relative;
            width: 40px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch-slider {
            position: absolute;
            cursor: pointer;
            background-color: #ccc;
            border-radius: 20px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: 0.3s;
        }

        .switch-slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 2px;
            top: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        INPUT.switch-toggle:checked ~ .switch-toggle-wrapper .switch-slider {background-color: #2196F3;}

        INPUT.switch-toggle:checked ~ .switch-toggle-wrapper .switch-slider::before {transform: translateX(20px);}

        .switch-label-off,
        .switch-label-on {transition: opacity 0.3s ease, color 0.3s ease;}
        .switch-label-off {color: silver}
        INPUT.switch-toggle:checked ~ .switch-label-off {opacity: 0.3;color: silver}

        INPUT.switch-toggle:not(:checked) ~ .switch-label-on {
            opacity: 0.3;
        }

        INPUT.switch-toggle:checked ~ .switch-label-on {
            color: #2196F3;
        }
    </style>
    <style id="styles_hoja">
        BODY {
            font-family: 'Segoe UI', Roboto,-apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;

        #ocechart_tableinfo tr td:nth-child(3),

        #ocechart_tableinfo tr td:nth-child(6),

<div class="ocChart_chart_area" id="ocProductSales_chartContainer" style="border:2px blue solid">
    <div class="ocProductSales_loading" id="ocProductSales_loading">

<script>
    // Global chart instance using the existing OcEcharts class
    let salesChart;

    // Initialize when page loads - PRIORITY #1
    document.addEventListener('DOMContentLoaded', () => {
        // Set up mocking before initializing OcEcharts
        setupMockAPI();
        const initialParams = {
            includeForecasts: true
        };

        // Initialize clean OcEcharts (no internal mocking)
        salesChart = new OcEcharts(
            '#ocProductSales_chartContainer',
            '/api/monthly_sales.php',
            initialParams
        );


    });

    // Optional: Test method to demonstrate OcEcharts data access
    function testDataAccess() {
        if(!salesChart) {
            console.log('Chart not initialized yet');
            return;
        }

        // Test getting data for a specific month
        const mayData = salesChart.getDataAtMonth('2024-05');
        console.log('May 2024 Data:', mayData);

        // Test getting closest data to a date
        const closestData = salesChart.getDataAtDateClosest('2024-05-15');
        console.log('Closest to May 15:', closestData);
    }

    // Expose test function to console for debugging
    window.testDataAccess = testDataAccess;
    window.salesChart = salesChart; // For console debugging
    console.log('OcEcharts template loaded. var salesChart Use  testDataAccess() in console.');
</script>
