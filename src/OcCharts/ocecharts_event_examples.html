<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OcEcharts Event Handling Examples</title>
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .chart-container { height: 400px; margin-bottom: 20px; border: 1px solid #ddd; }
        .event-log { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 15px; 
            margin: 10px 0;
            max-height: 200px; 
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .status-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .status-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }
        .status-card h4 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        .button-group {
            margin: 10px 0;
        }
        .button-group button {
            margin-right: 10px;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button-group button:hover {
            background: #0056b3;
        }
        .highlight { background-color: #fff3cd !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OcEcharts Event Handling Demo</h1>
        
        <!-- Status Panel -->
        <div class="status-panel">
            <div class="status-card">
                <h4>Current State</h4>
                <div id="current-state">
                    <p>Visible Range: <span id="visible-range">-</span></p>
                    <p>Active Series: <span id="active-series">-</span></p>
                    <p>Chart Type: <span id="chart-type">line</span></p>
                    <p>Last Action: <span id="last-action">none</span></p>
                </div>
            </div>
            
            <div class="status-card">
                <h4>Quick Actions</h4>
                <div class="button-group">
                    <button onclick="zoomToLastYear()">Zoom to Last Year</button>
                    <button onclick="resetZoom()">Reset Zoom</button>
                    <button onclick="toggleSeries()">Toggle First Series</button>
                    <button onclick="exportCurrentView()">Export Current View</button>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div id="chart-container" class="chart-container"></div>

        <!-- Event Log -->
        <div>
            <h3>Event Log <button onclick="clearEventLog()" style="float: right;">Clear</button></h3>
            <div id="event-log" class="event-log"></div>
        </div>

        <!-- Data Table -->
        <table id="ocechart_tableinfo" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="background: #f8f9fa;">
                    <th style="padding: 10px; border: 1px solid #dee2e6;">Series</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6;">First (Dataset)</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6;">First Value</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6; background: #fff3cd;">Visible First</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6; background: #fff3cd;">Visible Last</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6;">Tooltip</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6;">Last (Dataset)</th>
                    <th style="padding: 10px; border: 1px solid #dee2e6;">Last Value</th>
                </tr>
            </thead>
            <tbody>
                <!-- Will be populated by OcEcharts -->
            </tbody>
        </table>
    </div>

    <!-- ECharts Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    
    <script>
        let chartInstance;

        // Initialize chart when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeChart();
        });

        function initializeChart() {
            // Mock the OcEcharts class with event handling
            chartInstance = {
                chart: echarts.init(document.getElementById('chart-container')),
                currentParams: {},
                seriesConfig: {},
                
                // Include all the event handling methods from the previous artifact
                _setupEventListeners: function() {
                    this._removeEventListeners();
                    
                    this.chart.on('dataZoom', (params) => {
                        logEvent('DataZoom', `Start: ${params.start?.toFixed(1)}%, End: ${params.end?.toFixed(1)}%`);
                        this._onDataZoomChange(params);
                    });

                    this.chart.on('legendselectchanged', (params) => {
                        const selectedCount = Object.values(params.selected).filter(Boolean).length;
                        logEvent('Legend Changed', `${selectedCount} series selected`);
                        this._onLegendChange(params);
                    });

                    this.chart.on('magictypechanged', (params) => {
                        logEvent('Chart Type Changed', `Switched to: ${params.currentType}`);
                        updateChartType(params.currentType);
                    });

                    this.chart.on('restore', (params) => {
                        logEvent('Chart Restored', 'Reset to original view');
                        updateLastAction('Chart Restored');
                    });

                    this.chart.on('click', (params) => {
                        if (params.componentType === 'series') {
                            logEvent('Series Clicked', `${params.seriesName}: ${params.value[1]} at ${params.name}`);
                        }
                    });

                    this.chart.on('mouseover', (params) => {
                        if (params.componentType === 'series') {
                            updateTableHighlight(params.seriesName, true);
                        }
                    });

                    this.chart.on('mouseout', (params) => {
                        if (params.componentType === 'series') {
                            updateTableHighlight(params.seriesName, false);
                        }
                    });
                },

                _removeEventListeners: function() {
                    if (!this.chart) return;
                    this.chart.off('dataZoom');
                    this.chart.off('legendselectchanged');
                    this.chart.off('magictypechanged');
                    this.chart.off('restore');
                    this.chart.off('click');
                    this.chart.off('mouseover');
                    this.chart.off('mouseout');
                },

                _onDataZoomChange: function(params) {
                    updateVisibleRange(params);
                    updateLastAction('Data Zoom');
                    
                    // Simulate updating visible values in table
                    updateVisibleValuesInTable(params);
                },

                _onLegendChange: function(params) {
                    updateActiveSeries(params.selected);
                    updateLastAction('Legend Toggle');
                }
            };

            // Create sample chart
            createSampleChart();
            
            // Set up event listeners
            chartInstance._setupEventListeners();
        }

        function createSampleChart() {
            // Generate sample time series data
            const dates = [];
            const now = new Date();
            for(let i = 23; i >= 0; i--) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                dates.push(date);
            }

            const series1Data = dates.map(date => [date, Math.random() * 1000 + 500]);
            const series2Data = dates.map(date => [date, Math.random() * 800 + 300]);
            const series3Data = dates.map(date => [date, Math.random() * 1200 + 400]);

            const option = {
                title: {
                    text: 'Interactive Event Demo Chart',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                legend: {
                    data: ['Product A', 'Product B', 'Product C'],
                    top: 30
                },
                toolbox: {
                    feature: {
                        magicType: {
                            show: true,
                            type: ['line', 'bar']
                        },
                        restore: { show: true },
                        saveAsImage: { show: true }
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '20%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'time'
                },
                yAxis: {
                    type: 'value'
                },
                dataZoom: [
                    {
                        type: 'slider',
                        show: true,
                        start: 0,
                        end: 100
                    },
                    {
                        type: 'inside'
                    }
                ],
                series: [
                    {
                        name: 'Product A',
                        type: 'line',
                        data: series1Data,
                        smooth: true
                    },
                    {
                        name: 'Product B',
                        type: 'line',
                        data: series2Data,
                        smooth: true
                    },
                    {
                        name: 'Product C',
                        type: 'line',
                        data: series3Data,
                        smooth: true
                    }
                ]
            };

            chartInstance.chart.setOption(option);
            
            // Populate initial table
            populateSampleTable();
        }

        function populateSampleTable() {
            const tbody = document.querySelector('#ocechart_tableinfo tbody');
            const series = ['Product A', 'Product B', 'Product C'];
            const colors = ['#5470c6', '#91cc75', '#fac858'];
            
            tbody.innerHTML = '';
            
            series.forEach((seriesName, index) => {
                const row = tbody.insertRow();
                row.dataset.series = seriesName;
                
                row.innerHTML = `
                    <td style="padding: 8px; border: 1px solid #dee2e6;">
                        <span style="display:inline-block;width:12px;height:12px;background:${colors[index]};border-radius:50%;margin-right:8px;"></span>
                        ${seriesName}
                    </td>
                    <td style="padding: 8px; border: 1px solid #dee2e6;">2022-01</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6;">1,234</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6; background: #fff3cd;" class="visible-first">1,234</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6; background: #fff3cd;" class="visible-last">1,456</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6;" class="tooltip-value">-</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6;">2024-08</td>
                    <td style="padding: 8px; border: 1px solid #dee2e6;">1,456</td>
                `;
            });
        }

        // Event handling functions
        function logEvent(type, details) {
            const timestamp = new Date().toLocaleTimeString();
            const log = document.getElementById('event-log');
            const entry = `[${timestamp}] ${type}: ${details}\n`;
            log.textContent += entry;
            log.scrollTop = log.scrollHeight;
        }

        function updateVisibleRange(params) {
            const start = params.start || 0;
            const end = params.end || 100;
            document.getElementById('visible-range').textContent = `${start.toFixed(1)}% - ${end.toFixed(1)}%`;
        }

        function updateActiveSeries(selected) {
            const activeCount = Object.values(selected).filter(Boolean).length;
            const totalCount = Object.keys(selected).length;
            document.getElementById('active-series').textContent = `${activeCount}/${totalCount}`;
        }

        function updateChartType(type) {
            document.getElementById('chart-type').textContent = type;
        }

        function updateLastAction(action) {
            document.getElementById('last-action').textContent = action;
        }

        function updateTableHighlight(seriesName, highlight) {
            const row = document.querySelector(`tr[data-series="${seriesName}"]`);
            if (row) {
                if (highlight) {
                    row.classList.add('highlight');
                } else {
                    row.classList.remove('highlight');
                }
            }
        }

        function updateVisibleValuesInTable(params) {
            // Simulate updating visible first/last values
            const rows = document.querySelectorAll('#ocechart_tableinfo tbody tr');
            rows.forEach(row => {
                const firstCell = row.querySelector('.visible-first');
                const lastCell = row.querySelector('.visible-last');
                
                if (firstCell && lastCell) {
                    // Simulate new values based on zoom level
                    const randomFirst = Math.floor(Math.random() * 1000 + 500);
                    const randomLast = Math.floor(Math.random() * 1000 + 500);
                    
                    firstCell.textContent = randomFirst.toLocaleString();
                    lastCell.textContent = randomLast.toLocaleString();
                }
            });
        }

        function clearEventLog() {
            document.getElementById('event-log').textContent = '';
        }

        // Quick action functions
        function zoomToLastYear() {
            const option = chartInstance.chart.getOption();
            chartInstance.chart.setOption({
                dataZoom: [{
                    start: 50,
                    end: 100
                }]
            });
            logEvent('Action', 'Zoomed to last year');
        }

        function resetZoom() {
            chartInstance.chart.setOption({
                dataZoom: [{
                    start: 0,
                    end: 100
                }]
            });
            logEvent('Action', 'Reset zoom to full range');
        }

        function toggleSeries() {
            const option = chartInstance.chart.getOption();
            const firstSeriesName = option.series[0].name;
            
            chartInstance.chart.dispatchAction({
                type: 'legendToggleSelect',
                name: firstSeriesName
            });
            logEvent('Action', `Toggled ${firstSeriesName} series`);
        }

        function exportCurrentView() {
            const visibleRange = document.getElementById('visible-range').textContent;
            const activeSeries = document.getElementById('active-series').textContent;
            
            logEvent('Action', `Export requested - Range: ${visibleRange}, Series: ${activeSeries}`);
            alert(`Would export current view:\nRange: ${visibleRange}\nActive Series: ${activeSeries}`);
        }
    </script>
</body>
</html>
