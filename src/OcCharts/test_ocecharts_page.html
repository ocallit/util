<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <title>Test OcEcharts Class</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --color-primary: #00008b;
            --color-secondary: #4682b4;
            --color-accent: #ff6b35;
            --color-success: #28a745;
            --color-fail: #dc3545;
            --color-surface: #ffffff;
            --color-border: #dee2e6;
            --color-text: #212529;
            --color-text-light: #6c757d;
            --elevation-1: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
            --elevation-2: 0 3px 6px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: var(--color-text);
        }

        .ocTest_container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .ocTest_controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            background: var(--color-surface);
            border-radius: 8px;
            box-shadow: var(--elevation-1);
            align-items: center;
        }

        .ocTest_control_group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 150px;
        }

        .ocTest_label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text);
        }

        .ocTest_input, .ocTest_select {
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 0.9rem;
            background: var(--color-surface);
        }

        .ocTest_button {
            padding: 10px 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .ocTest_button:hover {
            background: var(--color-secondary);
        }

        .ocTest_button--secondary {
            background: var(--color-secondary);
        }

        .ocTest_button--accent {
            background: var(--color-accent);
        }

        .ocTest_button--success {
            background: var(--color-success);
        }

        .ocTest_chart_container {
            width: 100%;
            height: 600px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-surface);
            position: relative;
            box-shadow: var(--elevation-1);
        }

        .ocProductSales_loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-text-light);
            font-size: 1.1rem;
            z-index: 10;
        }

        .ocTest_status {
            padding: 1rem;
            background: var(--color-surface);
            border-radius: 8px;
            box-shadow: var(--elevation-1);
        }

        .ocTest_status h3 {
            margin: 0 0 0.5rem 0;
            color: var(--color-primary);
        }

        .ocTest_status pre {
            background: #f8f9fa;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            overflow-x: auto;
            max-height: 200px;
            overflow-y: auto;
        }

        .ocTest_checkbox_group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .ocTest_checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ocTest_checkbox input[type="checkbox"] {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="ocTest_container">
        <h1>OcEcharts Class Test Page</h1>
        
        <!-- Controls -->
        <div class="ocTest_controls">
            <div class="ocTest_control_group">
                <label class="ocTest_label">Products:</label>
                <select class="ocTest_select" id="ocTest_products" multiple>
                    <option value="Alpha">Alpha</option>
                    <option value="Beta">Beta</option>
                    <option value="Gamma">Gamma</option>
                </select>
            </div>

            <div class="ocTest_control_group">
                <label class="ocTest_label">Date From:</label>
                <input type="date" class="ocTest_input" id="ocTest_dateFrom" value="2024-01-01">
            </div>

            <div class="ocTest_control_group">
                <label class="ocTest_label">Date To:</label>
                <input type="date" class="ocTest_input" id="ocTest_dateTo" value="2024-12-31">
            </div>

            <div class="ocTest_control_group">
                <label class="ocTest_label">Currency:</label>
                <select class="ocTest_select" id="ocTest_currency">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="MXN">MXN</option>
                </select>
            </div>

            <div class="ocTest_control_group">
                <label class="ocTest_label">Date Format:</label>
                <select class="ocTest_select" id="ocTest_dateFormat">
                    <option value="month">Month/Year (Jan/24)</option>
                    <option value="quarter">Quarter/Year (Q1/24)</option>
                    <option value="semester">Semester/Year (S1/24)</option>
                    <option value="date">Full Date (2024-01-15)</option>
                </select>
            </div>

            <div class="ocTest_control_group">
                <label class="ocTest_label">Options:</label>
                <div class="ocTest_checkbox_group">
                    <div class="ocTest_checkbox">
                        <input type="checkbox" id="ocTest_forecasts" checked>
                        <label for="ocTest_forecasts">Include Forecasts</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="ocTest_controls">
            <button class="ocTest_button" onclick="testUpdateChart()">Update Chart (with filters)</button>
            <button class="ocTest_button ocTest_button--secondary" onclick="testRefreshData()">Refresh Data (silent)</button>
            <button class="ocTest_button ocTest_button--accent" onclick="testGetCurrentParams()">Get Current Params</button>
            <button class="ocTest_button ocTest_button--success" onclick="testDataAccess()">Test Data Access</button>
        </div>

        <!-- Chart Container -->
        <div class="ocTest_chart_container" id="ocProductSales_chartContainer">
            <div class="ocProductSales_loading" id="ocProductSales_loading">
                Cargando datos del gráfico...
            </div>
        </div>

        <!-- Status Display -->
        <div class="ocTest_status">
            <h3>Status & Results:</h3>
            <pre id="ocTest_results">Chart initialized. Use the controls above to test different methods.</pre>
        </div>
    </div>

    <!-- Load ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
    
    <!-- Load OcEcharts Class -->
    <script src="OcEcharts.js"></script>

    <script>
        // Global chart instance
        let chart;
        
        // Initialize chart when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize with some default parameters
            const initialParams = {
                products: ['Alpha', 'Beta'],
                dateFrom: '2024-01-01',
                dateTo: '2024-12-31',
                includeForecasts: true,
                currency: 'USD'
            };
            
            chart = new OcEcharts(
                '#ocProductSales_chartContainer',
                '/api/product_sales_data.php?x=1&test=true',
                initialParams
            );
            
            updateStatus('Chart initialized with default parameters');
            
            // Set form values to match initial params
            updateFormFromParams(initialParams);
        });

        // Test updateChart method
        async function testUpdateChart() {
            const params = getFormParams();
            updateStatus('Calling updateChart() with parameters: ' + JSON.stringify(params, null, 2));
            
            try {
                await chart.updateChart(params);
                updateStatus('✅ updateChart() completed successfully');
            } catch (error) {
                updateStatus('❌ updateChart() failed: ' + error.message);
            }
        }

        // Test refreshData method
        async function testRefreshData() {
            updateStatus('Calling refreshData() - should be silent...');
            
            try {
                await chart.refreshData();
                updateStatus('✅ refreshData() completed silently - data updated without disruption');
            } catch (error) {
                updateStatus('❌ refreshData() failed: ' + error.message);
            }
        }

        // Test getCurrentParams method
        function testGetCurrentParams() {
            const params = chart.getCurrentParams();
            updateStatus('Current parameters from chart:\n' + JSON.stringify(params, null, 2));
        }

        // Test data access methods
        function testDataAccess() {
            const testDate = '2024-05-01';
            
            const exactData = chart.getDataAtDate(testDate);
            const closestData = chart.getDataAtDateClosest(testDate);
            const monthData = chart.getDataAtMonth('2024-05');
            
            const results = {
                testDate: testDate,
                exactMatch: exactData,
                closestMatch: closestData,
                monthData: monthData
            };
            
            updateStatus('Data access test results:\n' + JSON.stringify(results, null, 2));
        }

        // Helper function to get parameters from form
        function getFormParams() {
            const productsSelect = document.getElementById('ocTest_products');
            const selectedProducts = Array.from(productsSelect.selectedOptions).map(option => option.value);
            
            return {
                products: selectedProducts,
                dateFrom: document.getElementById('ocTest_dateFrom').value,
                dateTo: document.getElementById('ocTest_dateTo').value,
                currency: document.getElementById('ocTest_currency').value,
                includeForecasts: document.getElementById('ocTest_forecasts').checked
            };
        }

        // Helper function to update form from parameters
        function updateFormFromParams(params) {
            if (params.products) {
                const productsSelect = document.getElementById('ocTest_products');
                Array.from(productsSelect.options).forEach(option => {
                    option.selected = params.products.includes(option.value);
                });
            }
            
            if (params.dateFrom) {
                document.getElementById('ocTest_dateFrom').value = params.dateFrom;
            }
            
            if (params.dateTo) {
                document.getElementById('ocTest_dateTo').value = params.dateTo;
            }
            
            if (params.currency) {
                document.getElementById('ocTest_currency').value = params.currency;
            }
            
            if (params.dateFormat) {
                document.getElementById('ocTest_dateFormat').value = params.dateFormat;
            }
            
            if (params.includeForecasts !== undefined) {
                document.getElementById('ocTest_forecasts').checked = params.includeForecasts;
            }
        }

        // Helper function to update status display
        function updateStatus(message) {
            const resultsElement = document.getElementById('ocTest_results');
            const timestamp = new Date().toLocaleTimeString();
            resultsElement.textContent = `[${timestamp}] ${message}`;
            console.log(`[${timestamp}] ${message}`);
        }

        // Auto-refresh every 10 seconds to test refreshData
        setInterval(() => {
            if (chart) {
                chart.refreshData();
                console.log('Auto-refresh executed (silent)');
            }
        }, 10000);
    </script>
</body>
</html>
